# Cutover Node → Rust: SEMUA path ke mudah-rs (plan/CUTOVER.md).
#
# Tidak ada `server … backup` ke Node: Node dan Rust tidak boleh melayani bersamaan
# (cron, antrean, cache in-process). Rollback = arahkan `proxy_pass` kembali ke upstream Node.
#
# Cara pakai: upstream di konteks `http {}`; ganti `proxy_pass` di `location /` server API yang
# sekarang menjadi `http://mudah_rs`. Nilai lain di `location /` itu (client_max_body_size,
# timeout, header) DIPERTAHANKAN — contoh di bawah hanya pengingat yang wajib ada.
# `nginx -t && nginx -s reload`.

# ── konteks http {} ─────────────────────────────────────────────────────────────
upstream mudah_rs {
    server 127.0.0.1:3100 max_fails=3 fail_timeout=10s;   # RS_PORT
    keepalive 64;
}

# ── di dalam server {} API ──────────────────────────────────────────────────────
# location / {
#     proxy_pass http://mudah_rs;
#     proxy_http_version 1.1;
#     proxy_set_header Connection "";                    # keepalive ke upstream
#     proxy_set_header Host $host;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # rate limit: entri paling kanan
#     proxy_set_header X-Forwarded-Proto $scheme;
#     client_max_body_size 50m;                         # /users/local-db menerima 50 MB (Node main.ts:48)
#     proxy_read_timeout <sama dengan Node>;            # ekspor laporan/PDF bisa lama
# }
#
# `/.well-known/oauth-*` (MCP OAuth) harus ikut sampai ke API; bila server ini punya
# `location /.well-known/` lain (mis. ACME), tambahkan:
# location ^~ /.well-known/oauth- { proxy_pass http://mudah_rs; ... header sama ... }
