# ── snippets/mudah-rs-proxy.conf ────────────────────────────────────────────────
# proxy_pass http://mudah_rs;                 # tanpa URI: path & query diteruskan apa adanya
# proxy_http_version 1.1;
# proxy_set_header Connection "";
# proxy_set_header Host $host;
# proxy_set_header X-Real-IP $remote_addr;
# proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# proxy_set_header X-Forwarded-Proto $scheme;
# proxy_next_upstream error;                  # hanya galat koneksi; POST yang sudah terkirim tidak diulang
# proxy_next_upstream_tries 2;
# client_max_body_size 10m;                   # samakan dengan location Node
# proxy_read_timeout 120s;                    # samakan dengan location Node
# JANGAN menambah add_header di sini: add_header di location mematikan add_header warisan
# dari server {} (header keamanan/CORS yang dipasang nginx untuk Node akan hilang).
