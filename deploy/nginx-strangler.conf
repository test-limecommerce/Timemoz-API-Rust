# Strangler fig Node → Rust di nginx (prod tidak memakai Traefik; deploy/traefik-strangler.toml
# hanya untuk docker-compose lokal Mudah-API).
#
# Cara pakai: salin upstream ke konteks `http {}`, lalu blok `location` ke dalam `server {}` API
# yang sudah ada. `location /` yang sekarang ke Node TIDAK diubah: semua path yang tidak
# disebut di bawah tetap ke Node. Aktifkan satu blok per rilis, `nginx -t && nginx -s reload`.
# Rollback = beri komentar lagi pada blok itu, lalu reload.
#
# Alamat di bawah contoh: ganti dengan alamat Node & Rust di server prod.

# ── konteks http {} ─────────────────────────────────────────────────────────────
upstream mudah_rs {
    server 127.0.0.1:3100 max_fails=3 fail_timeout=10s;   # RS_PORT
    # Cadangan: bila proses Rust mati/tidak bisa dihubungi, nginx meneruskan ke Node
    # (Node masih punya semua route). Hanya untuk galat koneksi: request yang sudah
    # terkirim ke Rust tidak diulang (lihat proxy_next_upstream di bawah).
    server 127.0.0.1:3000 backup;                          # alamat Node yang sekarang
    keepalive 32;
}

# ── di dalam server {} API ──────────────────────────────────────────────────────
#
# Header & batas di bawah HARUS sama dengan `location /` Node yang sekarang
# (terutama client_max_body_size dan proxy_read_timeout; salin nilainya dari sana).
#
# X-Forwarded-For wajib `$proxy_add_x_forwarded_for`: rate limit Rust membaca entri
# PALING KANAN, sama dengan Express `trust proxy 1` di Node.
#
# Rust sudah memasang CORS sendiri (daftar origin `main.ts`); bila nginx prod juga
# menambah header CORS untuk Node, perlakuan yang sama berlaku di sini.
#
# `^~` mencegah location regex lain di server ini (mis. aturan file statis) merebut path ini.

# Fase 3 langkah 1 — trackings. `/trackings` dan `/trackings/...` saja, BUKAN `/tracking-timelines`.
# location = /trackings  { include snippets/mudah-rs-proxy.conf; }
# location ^~ /trackings/ { include snippets/mudah-rs-proxy.conf; }

